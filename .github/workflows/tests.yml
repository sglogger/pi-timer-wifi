name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q server.py ui_config.py native_client.py native_ui.py firmware tools deploy
      - run: python -m pip install mpy-cross==1.29.0.post2
      - run: python tools/check_firmware.py
  native-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-tk python3-pil xvfb fonts-dejavu-core
      - run: timeout 30s xvfb-run -a -s '-screen 0 1024x600x24' /usr/bin/python3 tests/ui_smoke.py
        env:
          UI_SCREENSHOT: native-ui.png
      - uses: actions/upload-artifact@v4
        with:
          name: native-ui-preview
          path: native-ui.png
